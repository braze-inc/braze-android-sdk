// Java deprecation failures. Kotlin allWarningsAsErrors is configured in BrazeAndroidModulePlugin
// (KotlinCompile is not on the Groovy apply-from classpath under AGP built-in Kotlin).
tasks.withType(JavaCompile) {
  options.deprecation = true
  options.compilerArgs += ['-Xlint:deprecation']

  // Only print warnings for tests, don't break the build
  if (!it.name.toLowerCase().contains("debug")) {
    options.compilerArgs += ['-Werror']
  }
}
